version: '3.8'

services:
  # Mandatory services
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - inception-net
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    networks:
      - inception-net
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      REDIS_HOST: redis
    secrets:
      - db_password
      - wp_admin_password
      - credentials
    volumes:
      - wordpress_data:/var/www/html

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
      - static-site
    networks:
      - inception-net
    ports:
      - "443:443"
      - "8080:80"  # Static site port
      - "8081:8081" # Adminer port
      - "9000:9000" # Portainer port
      - "21:21"    # FTP port
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Bonus services
  redis:
    build:
      context: ./requirements/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    restart: always
    networks:
      - inception-net
    volumes:
      - redis_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  ftp:
    build:
      context: ./requirements/ftp
      dockerfile: Dockerfile
    image: ftp
    container_name: ftp
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception-net
    environment:
      FTP_USER: ftpuser
      FTP_PASS: ftppass123!
    volumes:
      - wordpress_data:/var/www/html:rw

  static-site:
    build:
      context: ./requirements/static-site
      dockerfile: Dockerfile
    image: static-site
    container_name: static-site
    restart: always
    networks:
      - inception-net
    volumes:
      - ./requirements/static-site/html:/usr/share/nginx/html:ro

  adminer:
    build:
      context: ./requirements/adminer
      dockerfile: Dockerfile
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception-net
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: pepa-linha

  portainer:
    build:
      context: ./requirements/portainer
      dockerfile: Dockerfile
    image: portainer
    container_name: portainer
    restart: unless-stopped
    networks:
      - inception-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    environment:
      - TZ=Africa/Casablanca
      - PORTAINER_SESSION_TIMEOUT=24h

networks:
  inception-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/credentials.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oussama/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oussama/data/wordpress
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oussama/data/redis
  portainer_data:
    name: portainer_data